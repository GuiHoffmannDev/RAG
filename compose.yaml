# Production-like stack. For hot reload add the development override:
#   docker compose -f compose.yaml -f compose.dev.yaml up
name: agentic-corrective-rag

x-app: &app
  image: agentic-corrective-rag:${APP_VERSION:-latest}
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: runtime
  env_file:
    - path: .env
      required: false
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-backend-env: &backend-env
  QDRANT_URL: http://qdrant:6333
  OLLAMA_URL: ${OLLAMA_DOCKER_URL:-http://host.docker.internal:11434}

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333; printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3; read -r line <&3; [[ $$line == *200* ]]'"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *app
    environment:
      <<: *backend-env
      SERVICE: api
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      # First start indexes the bundled corpus before the API listens.
      start_period: 180s

  ui:
    <<: *app
    environment:
      SERVICE: ui
      API_URL: http://api:8000
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${UI_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Optional HTTPS reverse proxy for the UI: `docker compose --profile proxy up -d` with DOMAIN set.
  proxy:
    profiles: [proxy]
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      ui:
        condition: service_healthy

  # Evaluation: `make eval ARGS="--judge-provider ollama"`, or
  # `docker compose --profile eval run --rm eval python -m src.eval.run_evaluation --help`.
  eval:
    profiles: [eval]
    image: agentic-corrective-rag-eval:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: eval
    env_file:
      - path: .env
        required: false
    environment: *backend-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./evals:/service/evals
    depends_on:
      api:
        condition: service_healthy

volumes:
  qdrant-data:
  caddy-data:
