name: RAG checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333
    env:
      TEST_QDRANT_URL: http://localhost:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r tests/requirements.txt -r evals/requirements.txt
      - run: ruff check . && ruff format --check .
      - run: python -c 'from ragas.metrics.collections import Faithfulness'
      - run: pytest -q --cov
